<!DOCTYPE html>
<html lang = "pt-BR">
    
<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width=device_width, initial_scale = 1.0">
    <title> Análise de Posts </title>
    <link rel = "stylesheet" href = "style.css">
</head>

<body>
    <header class = "app_bar">
        <img src = "../assets/logo_drfisiologia.png" alt = "Logo" class = "logo">
        <img src = "../assets/lupa_drfisiologia.png" alt = "Lupa" class = "lupa">
    </header>

    <main class = "container">
        <!-- Nome ou Link do Perfil -->
        <section class="form_section">
            <div class = "form_group">
                <input id = "profile_input" type = "text" placeholder = "Nome ou Link do perfil" class = "input_perfil">
            </div>
        </section>

        <!-- Datas Inicial e Final -->
        <section class = "form_group">
            <div>
                <input id = "start_date" type = "date" class = "input_date">
                <input id = "end_date" type = "date" class = "input_date">
            </div>
        </section>

        <!-- Botão Buscar Posts -->
           <button id = "fetch_posts" class = "button"> Buscar Posts </button>

        <!-- Tipos de Posts -->
        <h3>Tipos dos Posts</h3>
        <div class = "type_format_counters">
            <label for = "education_count"> Educação em saúde: </label>
            <input id = "education_count" type = "number" class = "input_type_format" value = "0">

            <label for = "commemorative_count"> Data Comemorativa: </label>
            <input id = "commemorative_count" type = "number" class = "input_type_format" value = "0">

            <label for = "publicity_count"> Data Comemorativa: </label>
            <input id = "publicity_count" type = "number" class = "input_type_format" value = "0">
        </div>

        <!-- Formatos de Posts -->
        <h3>Formatos dos Posts</h3>
        <div class = "type_format_counters">
            <label for = "estatic"> Estático: </label>
            <input id = "estatic_count" type = "number" class = "input_type_format" value = "0">

            <label for = "sidecar_count"> Corrossel: </label>
            <input id = "sidecar_count" type = "number" class = "input_type_format" value = "0">

            <label for = "reel_count"> Reel: </label>
            <input id = "reel_count" type = "number" class = "input_type_format" value = "0">
        </div>

        <!-- Classificação por Estrelas -->
        <div class = "stars">
            <h3> Classificação por estrelas </h3>
            <div id = "star_rating" class = "star_rating"></div>
        </div>

        <!-- Posts Capturados -->
         <section>
            <h2> Posts Capturados </h2>
            <div id = "post_grid" class = "grid"></div>
        </section>
    </main>

    <script src = "script.js"></script>
</body>

</html>
