<!DOCTYPE html>

<style>
    /*--- ESTILOS GERAIS ---*/
body {
    font-family: Tahoma, sans-serif;
    background-color: #E2E2E2;
    margin: 0;
    padding: 0;
}

.app_bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #0F4655;
    padding: 0px;
}

.container {
    padding: 36px;
    text-align: center;
    margin: auto;
}

.form_group {
    text-align: center;
    margin-bottom: 24px;
}

/*--- CAMPOS DE TEXTOS ---*/
input {
    text-align: center;
    margin-right: 1%;
    border: 1px solid #0F4655;
    border-radius: 6px;
}

.input_perfil {
    font-size: 16px;
    height: 40px;
    width: 24%;
}

.input_date {
    height: 40px;
    width: 12%;
    margin-right: 1%;
    font-size: large;
}

.input_type_format {
    font-size: 20px;
    text-align: center;
    height: fit-content;
    width: 2%;
    margin-right: 1%;
}

/*--- BOTÃO ---*/
.button {
    width: 200px;
    font-size: medium;
    background-color: #0F4655;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 18px;
    cursor: pointer;
}

button:hover {
    background-color: #1a83a3;
}

.type_format_counters {
    font-weight: 500;
    padding: 0.5%;
}

/*--- ESTRELAS ---*/

.stars {
    font-size: 16px;
}

.star_rating {
    display: flex;
    gap: 6px;
}

.star_rating span {
    font-size: 24px;
}

h2 {
    color: #0F4655;
}

h3 {
    color: #0F4655;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 16px;
}

.grid img {
    width: 100%;
    border-radius: 6px;
}

.post_item {
    border: 1px solid #ccc;
    padding: 15px;
    border-radius: 5px;
    background-color: #f9f9f9;
}

.post_item p {
    margin: 5px 0;
}
</style>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Posts</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="app_bar">
        <img src="{{ url_for('static', filename='assets/logo_drfisiologia.png') }}" alt="Logo" class="logo">
        <img src="{{ url_for('static', filename='assets/lupa_drfisiologia.png') }}" alt="Lupa" class="lupa">
    </header>

    <main class="container">
        <!-- Nome ou Link do Perfil -->
        <section class="form_section">
            <div class="form_group">
                <input id="profile_input" type="text" placeholder="Nome ou Link do perfil" class="input_perfil">
            </div>
        </section>

        <!-- Datas Inicial e Final -->
        <section class="form_group">
            <div>
                <input id="start_date" type="date" class="input_date">
                <input id="end_date" type="date" class="input_date">
            </div>
        </section>

        <!-- Botão Buscar Posts -->
        <button id="fetch_posts" class="button">Buscar Posts</button>

        <!-- Tipos de Posts -->
        <h3>Tipos dos Posts</h3>
        <div class="type_format_counters">
            <label for="education_count">Educação em saúde:</label>
            <input id="education_count" type="number" class="input_type_format" value="0" readonly>

            <label for="commemorative_count">Data Comemorativa:</label>
            <input id="commemorative_count" type="number" class="input_type_format" value="0" readonly>

            <label for="publicity_count">Publicidade:</label>
            <input id="publicity_count" type="number" class="input_type_format" value="0" readonly>
        </div>

        <!-- Formatos de Posts -->
        <h3>Formatos dos Posts</h3>
        <div class="type_format_counters">
            <label for="estatic_count">Estático:</label>
            <input id="estatic_count" type="number" class="input_type_format" value="0" readonly>

            <label for="sidecar_count">Carrossel:</label>
            <input id="sidecar_count" type="number" class="input_type_format" value="0" readonly>

            <label for="reel_count">Reel:</label>
            <input id="reel_count" type="number" class="input_type_format" value="0" readonly>
        </div>

        <!-- Classificação por Estrelas -->
        <div class="stars">
            <h3>Classificação por estrelas</h3>
            <div id="star_rating" class="star_rating"></div>
        </div>

        <!-- Posts Capturados -->
        <section>
            <h2>Posts Capturados</h2>
            <div id="post_grid" class="grid"></div>
        </section>
    </main>

    <script>
document.getElementById("fetch_posts").addEventListener("click", async () => {
    const username = document.getElementById("profile_input").value;
    let startDate = document.getElementById("start_date").value;
    let endDate = document.getElementById("end_date").value;

    if (!username || !startDate || !endDate) {
        alert("Por favor, preencha todos os campos!");
        return;
    }

    // Converte a data para o formato DD/MM/YYYY
    startDate = startDate.split("-").reverse().join("/");
    endDate = endDate.split("-").reverse().join("/");

    try {
        const response = await fetch("http://127.0.0.1:5000/analyze_posts", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                start_date: startDate,
                end_date: endDate
            })
        });

        if (!response.ok) {
            const error = await response.json();
            alert(`Erro: ${error.error}`);
            return;
        }

        const data = await response.json();
        document.getElementById("education_count").value = data.estatico;
        document.getElementById("commemorative_count").value = data.carrossel;
        document.getElementById("publicity_count").value = data.reel;

        // Atualizar classificação por estrelas
        document.getElementById("star_rating").textContent = `${data.estrela} Estrela(s)`;

        // Atualizar grid de posts
        const grid = document.getElementById("post_grid");
        grid.innerHTML = "";
        data.posts.forEach(post => {
            const div = document.createElement("div");
            div.className = "post_item";
            div.innerHTML = `
                <p>Data: ${post.Data}</p>
                <p>Formato: ${post["Formato do Post"]}</p>
                <p>URL: <a href="${post["URL Encurtada"]}" target="_blank">Acessar Post</a></p>
                <p>Legenda: ${post.Legenda}</p>
            `;
            grid.appendChild(div);
        });
    } catch (err) {
        alert(`Erro ao buscar posts: ${err.message}`);
    }
});

    </script>
</body>
</html>
